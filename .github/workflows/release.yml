name: Release

# Tag-triggered PyPI publish via OIDC trusted publisher.
#
# CI (lint, typecheck, test, audit) runs on Gitea — see .gitea/workflows/ci.yml.
# This workflow exists only because PyPI's trusted-publisher feature requires
# GitHub Actions (or GitLab/Google Cloud/ActiveState — Gitea Actions is not
# supported). When a v* tag is pushed (Gitea origin → GitHub mirror), this
# workflow builds the sdist + wheel and publishes them to PyPI without any
# stored API token.
#
# Refs: roctinam/carbonyl-agent#11, #12

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches pyproject.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $PYPROJECT_VERSION"
            exit 1
          fi
      - run: pip install hatch twine
      - run: hatch build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: release
      url: https://pypi.org/p/carbonyl-agent
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI via trusted publisher (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # Mirrors the Gitea release to GitHub so both registries show the
    # same release notes for the tag. Runs after publish so PyPI is the
    # source of truth on release artefacts (#18).
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Pull the section between "## [VERSION]" (or "## VERSION") and the next "## " heading
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[?"ver"\\]?" { in_section=1; next }
            in_section && /^## / { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for $VERSION; using tag annotation instead." > release-notes.md
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: carbonyl-agent ${{ steps.notes.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
