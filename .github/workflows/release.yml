name: Release

# Tag-triggered PyPI publish via OIDC trusted publisher.
#
# CI (lint, typecheck, test, audit) runs on Gitea — see .gitea/workflows/ci.yml.
# This workflow exists only because PyPI's trusted-publisher feature requires
# GitHub Actions (or GitLab/Google Cloud/ActiveState — Gitea Actions is not
# supported). When a v* tag is pushed (Gitea origin → GitHub mirror), this
# workflow builds the sdist + wheel and publishes them to PyPI without any
# stored API token.
#
# Refs: roctinam/carbonyl-agent#11, #12

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches pyproject.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $PYPROJECT_VERSION"
            exit 1
          fi
      - run: pip install hatch twine
      - run: hatch build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: release
      url: https://pypi.org/p/carbonyl-agent
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI via trusted publisher (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
