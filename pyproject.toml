[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carbonyl-agent"
version = "2026.5.3"
description = "Python automation SDK for the Carbonyl headless browser"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pexpect>=4.9",
    "pyte>=0.8",
]

[project.urls]
# GitHub is the canonical public-facing remote (the mirror PyPI users
# will hit). Gitea is the dev-primary remote per the project's CLAUDE.md
# convention; declared here for completeness so issue links work for
# both audiences.
Homepage = "https://github.com/jmagly/carbonyl-agent"
Repository = "https://github.com/jmagly/carbonyl-agent"
Issues = "https://github.com/jmagly/carbonyl-agent/issues"
Changelog = "https://github.com/jmagly/carbonyl-agent/blob/main/CHANGELOG.md"

[project.scripts]
carbonyl-agent = "carbonyl_agent.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
]
bench = [
    "pytest-benchmark>=4.0",
]
docs = [
    "pdoc>=14.0",
]
# Cookie/token import from host browsers (carbonyl-agent#122).
# - `cryptography` is required to decrypt Chromium-family cookies (AES-128-CBC
#   under libsecret-derived keys).
# - `secretstorage` reads the libsecret 'Safe Storage' passphrase on Linux.
# Firefox import works without this extra (cookies are plaintext SQLite).
cookies = [
    "cryptography>=42",
    "secretstorage>=3.3",
]
# W3B (#44) — persona-bound HTTP egress. Phase 1 ships an httpx-backed
# client with audit/drift detection; Phase 2 will swap in a Rust wreq
# backend behind the same HttpClient trait for actual JA4 emission.
egress = [
    "httpx>=0.27",
]
# W3B Phase 2.4 (#83) — declares intent to use the wreq transport.
# The native `carbonyl_wreq` module is a developer build today
# (`maturin develop --manifest-path crates/carbonyl-wreq/Cargo.toml
# --features python`); #85 wires it into pip install. Installing
# this extra without building the native module is harmless —
# EgressClient detects the absence and falls back to the httpx
# stdlib-SSL path with an explicit `transport: httpx-fallback`
# audit row tag.
wreq = [
    "httpx>=0.27",
    "tomli_w>=1.0",
]

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests that require a real Carbonyl runtime binary and outbound network access (#15)",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["pexpect", "pyte", "uinput"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.hatch.build.targets.wheel]
packages = ["src/carbonyl_agent"]
# License + third-party attribution travel with the wheel so consumers
# have the notices regardless of how they obtained the package.
# THIRD_PARTY_LICENSES.txt is regenerated by scripts/gen-third-party-licenses.sh
# (#94). It currently aggregates the carbonyl-fingerprint dep tree;
# carbonyl-wreq deps will join once #88 ships the native module in the
# wheel and the wreq-util GPL-3.0 finding is resolved.
[tool.hatch.build.targets.wheel.force-include]
"LICENSE" = "carbonyl_agent/LICENSE"
"THIRD_PARTY_LICENSES.txt" = "carbonyl_agent/THIRD_PARTY_LICENSES.txt"

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "pyproject.toml",
    "README.md",
    "LICENSE",
    "THIRD_PARTY_LICENSES.txt",
    "about.toml",
    "about.hbs",
    "scripts/gen-third-party-licenses.sh",
    "CHANGELOG.md",
    "docs/",
]
