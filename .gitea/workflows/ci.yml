name: CI

# Runner choice rationale: lint and typecheck stay on ubuntu-latest (act-
# managed) because they currently pass there and the toolchain is just ruff
# + mypy, no native deps. Every other job uses runs-on: titan with a manual
# checkout + `docker run` for the toolchain. titan is the host-mode runner
# the sibling roctinam/carbonyl repo uses; jobs land in a real shell with
# docker access instead of an act container that may or may not have node.
# Past failures on this repo were "exec: \"node\": executable file not
# found in $PATH" inside an act container — that whole class of failure
# does not happen on titan.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" mypy
      - run: mypy --strict src/carbonyl_agent/

  test:
    runs-on: titan
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout (manual git clone)
        run: |
          rm -rf "${GITHUB_WORKSPACE}/.repo-clone" 2>/dev/null || true
          git clone --depth 1 --branch "${GITHUB_REF_NAME:-main}" \
            "https://token:${{ github.token }}@git.integrolabs.net/${GITHUB_REPOSITORY}.git" \
            "${GITHUB_WORKSPACE}/.repo-clone"
          cd "${GITHUB_WORKSPACE}/.repo-clone"
          git checkout "${GITHUB_SHA:-HEAD}" 2>/dev/null || true

      - name: pytest (python ${{ matrix.python-version }})
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/.repo-clone:/workspace" \
            -w /workspace \
            -e PIP_DISABLE_PIP_VERSION_CHECK=1 \
            -e PIP_ROOT_USER_ACTION=ignore \
            "python:${{ matrix.python-version }}-slim" \
            bash -c '
              set -euxo pipefail
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends git build-essential >/dev/null
              pip install -q -e ".[dev]" hypothesis
              pytest tests/ -x -q --tb=short --ignore=tests/e2e --ignore=tests/benchmarks
            '

  audit:
    runs-on: titan
    steps:
      - name: Checkout (manual git clone)
        run: |
          rm -rf "${GITHUB_WORKSPACE}/.repo-clone" 2>/dev/null || true
          git clone --depth 1 --branch "${GITHUB_REF_NAME:-main}" \
            "https://token:${{ github.token }}@git.integrolabs.net/${GITHUB_REPOSITORY}.git" \
            "${GITHUB_WORKSPACE}/.repo-clone"
          cd "${GITHUB_WORKSPACE}/.repo-clone"
          git checkout "${GITHUB_SHA:-HEAD}" 2>/dev/null || true

      - name: pip-audit
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/.repo-clone:/workspace" \
            -w /workspace \
            -e PIP_DISABLE_PIP_VERSION_CHECK=1 \
            -e PIP_ROOT_USER_ACTION=ignore \
            python:3.12-slim \
            bash -c '
              set -euxo pipefail
              pip install -q -e . pip-audit
              pip-audit
            '

  e2e:
    # End-to-end tests against a real Carbonyl runtime (#15).
    # Advisory (continue-on-error) per #15 acceptance.
    runs-on: titan
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: pinned
            install_args: ""
            label: ".carbonyl-runtime-version (current)"
          - runtime: previous
            install_args: "--tag runtime-3f5e5a96aa10c4ac"
            label: "runtime-3f5e5a96aa10c4ac (prior)"
    name: e2e (${{ matrix.label }})
    steps:
      - name: Checkout (manual git clone)
        run: |
          rm -rf "${GITHUB_WORKSPACE}/.repo-clone" 2>/dev/null || true
          git clone --depth 1 --branch "${GITHUB_REF_NAME:-main}" \
            "https://token:${{ github.token }}@git.integrolabs.net/${GITHUB_REPOSITORY}.git" \
            "${GITHUB_WORKSPACE}/.repo-clone"
          cd "${GITHUB_WORKSPACE}/.repo-clone"
          git checkout "${GITHUB_SHA:-HEAD}" 2>/dev/null || true

      - name: e2e suite (${{ matrix.label }})
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/.repo-clone:/workspace" \
            -w /workspace \
            -e PIP_DISABLE_PIP_VERSION_CHECK=1 \
            -e PIP_ROOT_USER_ACTION=ignore \
            python:3.12-slim \
            bash -c '
              set -euxo pipefail
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends git build-essential ca-certificates curl >/dev/null
              pip install -q -e ".[dev]"
              carbonyl-agent install ${{ matrix.install_args }}
              carbonyl-agent status
              pytest tests/e2e/ -v --tb=short
            '

  bench:
    # Advisory, non-blocking (#22). Surfaces regressions but never fails CI.
    runs-on: titan
    continue-on-error: true
    steps:
      - name: Checkout (manual git clone)
        run: |
          rm -rf "${GITHUB_WORKSPACE}/.repo-clone" 2>/dev/null || true
          git clone --depth 1 --branch "${GITHUB_REF_NAME:-main}" \
            "https://token:${{ github.token }}@git.integrolabs.net/${GITHUB_REPOSITORY}.git" \
            "${GITHUB_WORKSPACE}/.repo-clone"
          cd "${GITHUB_WORKSPACE}/.repo-clone"
          git checkout "${GITHUB_SHA:-HEAD}" 2>/dev/null || true

      - name: pytest --benchmark-only
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/.repo-clone:/workspace" \
            -w /workspace \
            -e PIP_DISABLE_PIP_VERSION_CHECK=1 \
            -e PIP_ROOT_USER_ACTION=ignore \
            python:3.12-slim \
            bash -c '
              set -euxo pipefail
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends git build-essential >/dev/null
              pip install -q -e ".[dev,bench]"
              pytest tests/benchmarks/ --benchmark-only --benchmark-json=bench.json
            '

  docs:
    runs-on: titan
    steps:
      - name: Checkout (manual git clone)
        run: |
          rm -rf "${GITHUB_WORKSPACE}/.repo-clone" 2>/dev/null || true
          git clone --depth 1 --branch "${GITHUB_REF_NAME:-main}" \
            "https://token:${{ github.token }}@git.integrolabs.net/${GITHUB_REPOSITORY}.git" \
            "${GITHUB_WORKSPACE}/.repo-clone"
          cd "${GITHUB_WORKSPACE}/.repo-clone"
          git checkout "${GITHUB_SHA:-HEAD}" 2>/dev/null || true

      - name: build-docs.sh
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/.repo-clone:/workspace" \
            -w /workspace \
            -e PIP_DISABLE_PIP_VERSION_CHECK=1 \
            -e PIP_ROOT_USER_ACTION=ignore \
            python:3.12-slim \
            bash -c '
              set -euxo pipefail
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends git build-essential >/dev/null
              pip install -q -e ".[docs]"
              ./scripts/build-docs.sh
            '
