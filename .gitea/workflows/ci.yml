name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" mypy
      - run: mypy --strict src/carbonyl_agent/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]" hypothesis
      - run: pytest tests/ -x -q --tb=short

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pip-audit
      - run: pip-audit

  e2e:
    # End-to-end tests against a real Carbonyl runtime (#15).
    #
    # Matrix dimension: runtime version (#21). Each cell installs a
    # different runtime tag and runs the full e2e suite, so SDK-vs-
    # runtime drift surfaces here before users hit it. Cells:
    #   - pinned   → whatever .carbonyl-runtime-version says (current
    #                supported version; what `carbonyl-agent install`
    #                resolves by default)
    #   - previous → known-good prior runtime for backwards-compat
    #                regression detection
    #
    # Both cells advisory (continue-on-error) per #15 acceptance —
    # promoted to blocking in Iteration 3 once cell stability is proven.
    # Single python+os cell (ubuntu + py3.12) because each run costs
    # ~2 min of network + browser spawn time.
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: pinned
            install_args: ""
            label: ".carbonyl-runtime-version (current)"
          - runtime: previous
            install_args: "--tag runtime-3f5e5a96aa10c4ac"
            label: "runtime-3f5e5a96aa10c4ac (prior)"
    name: e2e (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Install Carbonyl runtime (${{ matrix.label }})
        run: carbonyl-agent install ${{ matrix.install_args }}
      - name: Print resolved runtime
        run: carbonyl-agent status
      - name: Run E2E suite
        run: pytest tests/e2e/ -v --tb=short

  bench:
    # Advisory, non-blocking (#22). Surfaces regressions but never fails CI.
    # Real-binary benches land with #15.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,bench]"
      - run: pytest tests/benchmarks/ --benchmark-only --benchmark-json=bench.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ github.sha }}
          path: bench.json

  docs:
    # Build pdoc API reference and upload as artifact (#17). Doesn't
    # publish — release.yml on the GitHub side handles tag-driven
    # publishing if/when we wire gh-pages.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      - run: ./scripts/build-docs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: api-docs-${{ github.sha }}
          path: docs/api/
