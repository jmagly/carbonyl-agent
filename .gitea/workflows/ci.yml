name: CI

# Runner choice: every job runs on titan (host-mode runner with docker
# access). The sibling roctinam/carbonyl repo's CI uses the same pattern
# and has a green history; the previous ubuntu-latest setup was non-
# deterministic — runners with that label sometimes lacked node, so
# actions/checkout@v4 would die with "exec: \"node\": executable file not
# found in $PATH". Pinning to titan + using `docker run python:3.X-slim`
# instead of marketplace actions removes that whole class of flake.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: titan
    steps:
      - name: Checkout (manual git clone)
        run: |
          # Init + fetch-by-SHA. The previous `git clone --branch
          # ${GITHUB_REF_NAME}` form failed on pull_request events
          # because Gitea sets GITHUB_REF_NAME to the PR number
          # (e.g. `109`), which is not a branch name. Fetching the
          # resolved SHA works on both push and pull_request events
          # without caring what GITHUB_REF_NAME is.
          #   Refs: roctinam/carbonyl-agent#107, #108.
          rm -rf "${GITHUB_WORKSPACE}/.repo-clone" 2>/dev/null || true
          mkdir -p "${GITHUB_WORKSPACE}/.repo-clone"
          cd "${GITHUB_WORKSPACE}/.repo-clone"
          git init -q
          git remote add origin \
            "https://token:${{ github.token }}@git.integrolabs.net/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: ruff check
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/.repo-clone:/workspace" \
            -w /workspace \
            -e PIP_DISABLE_PIP_VERSION_CHECK=1 \
            -e PIP_ROOT_USER_ACTION=ignore \
            python:3.12-slim \
            bash -c '
              set -euxo pipefail
              pip install -q ruff
              ruff check src/ tests/
            '

  typecheck:
    runs-on: titan
    steps:
      - name: Checkout (manual git clone)
        run: |
          # Init + fetch-by-SHA. The previous `git clone --branch
          # ${GITHUB_REF_NAME}` form failed on pull_request events
          # because Gitea sets GITHUB_REF_NAME to the PR number
          # (e.g. `109`), which is not a branch name. Fetching the
          # resolved SHA works on both push and pull_request events
          # without caring what GITHUB_REF_NAME is.
          #   Refs: roctinam/carbonyl-agent#107, #108.
          rm -rf "${GITHUB_WORKSPACE}/.repo-clone" 2>/dev/null || true
          mkdir -p "${GITHUB_WORKSPACE}/.repo-clone"
          cd "${GITHUB_WORKSPACE}/.repo-clone"
          git init -q
          git remote add origin \
            "https://token:${{ github.token }}@git.integrolabs.net/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: mypy --strict
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/.repo-clone:/workspace" \
            -w /workspace \
            -e PIP_DISABLE_PIP_VERSION_CHECK=1 \
            -e PIP_ROOT_USER_ACTION=ignore \
            python:3.12-slim \
            bash -c '
              set -euxo pipefail
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends git build-essential >/dev/null
              pip install -q -e ".[dev,egress,cookies]" mypy
              mypy --strict src/carbonyl_agent/
            '

  test:
    runs-on: titan
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout (manual git clone)
        run: |
          # Init + fetch-by-SHA. The previous `git clone --branch
          # ${GITHUB_REF_NAME}` form failed on pull_request events
          # because Gitea sets GITHUB_REF_NAME to the PR number
          # (e.g. `109`), which is not a branch name. Fetching the
          # resolved SHA works on both push and pull_request events
          # without caring what GITHUB_REF_NAME is.
          #   Refs: roctinam/carbonyl-agent#107, #108.
          rm -rf "${GITHUB_WORKSPACE}/.repo-clone" 2>/dev/null || true
          mkdir -p "${GITHUB_WORKSPACE}/.repo-clone"
          cd "${GITHUB_WORKSPACE}/.repo-clone"
          git init -q
          git remote add origin \
            "https://token:${{ github.token }}@git.integrolabs.net/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: pytest (python ${{ matrix.python-version }})
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/.repo-clone:/workspace" \
            -w /workspace \
            -e PIP_DISABLE_PIP_VERSION_CHECK=1 \
            -e PIP_ROOT_USER_ACTION=ignore \
            "python:${{ matrix.python-version }}-slim" \
            bash -c '
              set -euxo pipefail
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends git build-essential >/dev/null
              pip install -q -e ".[dev,egress,cookies]" hypothesis
              pytest tests/ -x -q --tb=short --ignore=tests/e2e --ignore=tests/benchmarks
            '

  audit:
    runs-on: titan
    steps:
      - name: Checkout (manual git clone)
        run: |
          # Init + fetch-by-SHA. The previous `git clone --branch
          # ${GITHUB_REF_NAME}` form failed on pull_request events
          # because Gitea sets GITHUB_REF_NAME to the PR number
          # (e.g. `109`), which is not a branch name. Fetching the
          # resolved SHA works on both push and pull_request events
          # without caring what GITHUB_REF_NAME is.
          #   Refs: roctinam/carbonyl-agent#107, #108.
          rm -rf "${GITHUB_WORKSPACE}/.repo-clone" 2>/dev/null || true
          mkdir -p "${GITHUB_WORKSPACE}/.repo-clone"
          cd "${GITHUB_WORKSPACE}/.repo-clone"
          git init -q
          git remote add origin \
            "https://token:${{ github.token }}@git.integrolabs.net/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: pip-audit
        run: |
          # Upgrade pip first — the python:3.12-slim image ships with an
          # older pip that has its own CVEs (CVE-2025-8869 fixed in 25.3,
          # CVE-2026-1703 fixed in 26.0). CVE-2026-3219 has no fix
          # available at time of writing, so we ignore it explicitly so
          # the audit signal stays focused on project deps.
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/.repo-clone:/workspace" \
            -w /workspace \
            -e PIP_DISABLE_PIP_VERSION_CHECK=1 \
            -e PIP_ROOT_USER_ACTION=ignore \
            python:3.12-slim \
            bash -c '
              set -euxo pipefail
              pip install -q --upgrade pip
              pip install -q -e . pip-audit
              pip-audit --ignore-vuln CVE-2026-3219
            '

  bench:
    # Advisory, non-blocking (#22). Surfaces regressions but never fails CI.
    runs-on: titan
    continue-on-error: true
    steps:
      - name: Checkout (manual git clone)
        run: |
          # Init + fetch-by-SHA. The previous `git clone --branch
          # ${GITHUB_REF_NAME}` form failed on pull_request events
          # because Gitea sets GITHUB_REF_NAME to the PR number
          # (e.g. `109`), which is not a branch name. Fetching the
          # resolved SHA works on both push and pull_request events
          # without caring what GITHUB_REF_NAME is.
          #   Refs: roctinam/carbonyl-agent#107, #108.
          rm -rf "${GITHUB_WORKSPACE}/.repo-clone" 2>/dev/null || true
          mkdir -p "${GITHUB_WORKSPACE}/.repo-clone"
          cd "${GITHUB_WORKSPACE}/.repo-clone"
          git init -q
          git remote add origin \
            "https://token:${{ github.token }}@git.integrolabs.net/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: pytest --benchmark-only
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/.repo-clone:/workspace" \
            -w /workspace \
            -e PIP_DISABLE_PIP_VERSION_CHECK=1 \
            -e PIP_ROOT_USER_ACTION=ignore \
            python:3.12-slim \
            bash -c '
              set -euxo pipefail
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends git build-essential >/dev/null
              pip install -q -e ".[dev,bench]"
              pytest tests/benchmarks/ --benchmark-only --benchmark-json=bench.json
            '

  docs:
    runs-on: titan
    steps:
      - name: Checkout (manual git clone)
        run: |
          # Init + fetch-by-SHA. The previous `git clone --branch
          # ${GITHUB_REF_NAME}` form failed on pull_request events
          # because Gitea sets GITHUB_REF_NAME to the PR number
          # (e.g. `109`), which is not a branch name. Fetching the
          # resolved SHA works on both push and pull_request events
          # without caring what GITHUB_REF_NAME is.
          #   Refs: roctinam/carbonyl-agent#107, #108.
          rm -rf "${GITHUB_WORKSPACE}/.repo-clone" 2>/dev/null || true
          mkdir -p "${GITHUB_WORKSPACE}/.repo-clone"
          cd "${GITHUB_WORKSPACE}/.repo-clone"
          git init -q
          git remote add origin \
            "https://token:${{ github.token }}@git.integrolabs.net/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: build-docs.sh
        run: |
          # Build the pdoc bundle. pdoc surfaces type-resolution and
          # missing-doc problems as `Warn:` lines on stdout/stderr.
          # We fail the job if any are emitted — per #96, the release
          # asset is expected to be warning-free against the public
          # API surface. The `pip install httpx tomli_w` is a workaround
          # for httpx being declared as a TYPE_CHECKING-only import in
          # egress.py: pdoc 16+ evaluates TYPE_CHECKING blocks so the
          # module must be importable at doc-gen time even though it's
          # not a runtime hard dep.
          #   Refs: roctinam/carbonyl-agent#96
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/.repo-clone:/workspace" \
            -w /workspace \
            -e PIP_DISABLE_PIP_VERSION_CHECK=1 \
            -e PIP_ROOT_USER_ACTION=ignore \
            python:3.12-slim \
            bash -c '
              set -euxo pipefail
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends git build-essential >/dev/null
              pip install -q -e ".[docs]"
              # TYPE_CHECKING-only deps that pdoc still needs to import
              # to resolve annotations at doc-gen time.
              pip install -q httpx tomli_w
              ./scripts/build-docs.sh 2>&1 | tee /tmp/pdoc.log
              if grep -E "^(Warn:|Error)" /tmp/pdoc.log; then
                echo "::error::pdoc emitted warnings or errors above — fail build per #96"
                exit 1
              fi
              echo "[docs] pdoc bundle clean (0 warnings)"
            '
