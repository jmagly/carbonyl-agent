name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" mypy
      - run: mypy --strict src/carbonyl_agent/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]" hypothesis
      - run: pytest tests/ -x -q --tb=short

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pip-audit
      - run: pip-audit

  e2e:
    # End-to-end tests against a real Carbonyl runtime (#15).
    # Advisory in Iteration 2 — failures don't block CI; promoted to
    # blocking in Iteration 3 once the matrix is stable. Pinned to a
    # single matrix cell (ubuntu + py3.12) because each run costs ~2 min
    # of network + browser spawn time.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Install Carbonyl runtime
        run: carbonyl-agent install
      - name: Run E2E suite
        run: pytest tests/e2e/ -v --tb=short

  bench:
    # Advisory, non-blocking (#22). Surfaces regressions but never fails CI.
    # Real-binary benches land with #15.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,bench]"
      - run: pytest tests/benchmarks/ --benchmark-only --benchmark-json=bench.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ github.sha }}
          path: bench.json

  docs:
    # Build pdoc API reference and upload as artifact (#17). Doesn't
    # publish — release.yml on the GitHub side handles tag-driven
    # publishing if/when we wire gh-pages.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      - run: ./scripts/build-docs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: api-docs-${{ github.sha }}
          path: docs/api/
