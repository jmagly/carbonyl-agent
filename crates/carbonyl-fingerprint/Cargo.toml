[package]
name = "carbonyl-fingerprint"
version = "0.0.1-alpha.1"
edition = "2021"
description = "Owned fingerprint registry for Carbonyl trusted-automation personas: schema, sampler, validator, applier"
license = "MIT"
repository = "https://git.integrolabs.net/roctinam/carbonyl-agent"

[lib]
name = "carbonyl_fingerprint"
# `cdylib` enables building as a Python extension module via maturin when
# the `python` feature is active. `rlib` keeps the crate usable as a
# normal Rust dependency by sibling crates (e.g., carbonyl-fingerprint-py
# wrappers, sampler, registry).
crate-type = ["rlib", "cdylib"]

[features]
default = []
# Enable PyO3 bindings (`src/python.rs`). Build with:
#   maturin develop --manifest-path crates/carbonyl-fingerprint/Cargo.toml --features python
python = ["dep:pyo3"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
schemars = "0.8"
rand = "0.8"
sha2 = "0.10"
hkdf = "0.12"
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }

[dev-dependencies]
pretty_assertions = "1"
proptest = "1"
serde_json = "1"
# Layer 2 wire-level conformance (W3B.2.1 — `Refs: roctinam/carbonyl-agent#76`).
# Dev-deps only — these never reach the rlib or cdylib output. The
# LocalTlsResponder test utility lives under `tests/wire/` and is only
# compiled when running `cargo test`.
rustls = "0.23"
rustls-pemfile = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
tokio-rustls = "0.26"
rcgen = "0.13"
