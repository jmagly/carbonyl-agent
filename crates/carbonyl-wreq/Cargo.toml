[package]
name = "carbonyl-wreq"
version = "0.0.1-alpha.1"
edition = "2021"
description = "wreq-backed implementation of the carbonyl-fingerprint HttpClient trait"
license = "MIT"
repository = "https://git.integrolabs.net/roctinam/carbonyl-agent"

[lib]
name = "carbonyl_wreq"
# cdylib enables building as a Python extension module via maturin
# when the `python` feature is active. rlib keeps the crate usable as
# a normal Rust dep by carbonyl-wreq's own integration tests
# (Layer 2 conformance, etc.).
crate-type = ["rlib", "cdylib"]

[features]
default = []
# PyO3 bindings (src/python.rs) — build with:
#   maturin develop --manifest-path crates/carbonyl-wreq/Cargo.toml --features python
# Pulls in pyo3 + a multi-threaded tokio runtime; both are gated so
# pure-Rust consumers don't pay the cost.
python = ["dep:pyo3", "dep:tokio"]

[dependencies]
carbonyl-fingerprint = { path = "../carbonyl-fingerprint" }
thiserror = "2"

# wreq + wreq-util provide the browser-emulating HTTP/2 client. wreq
# pulls boring-sys2 (BoringSSL fork) which requires clang + cmake at
# build time — the project's `.gitea/workflows/check.yml` installs
# both before invoking cargo (`Refs: roctinam/carbonyl-agent#81`).
wreq = "5"
wreq-util = "2"
http = "1"
# toml parser only needed for the python feature's persona-TOML
# entry point; cheap to include unconditionally vs gating.
toml = "0.8"

# Optional — only present when the `python` feature is on.
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }

# Layer 2 wire conformance (W3B.Phase2.3 — `Refs: roctinam/carbonyl-agent#82`).
# These dev-deps mirror carbonyl-fingerprint's so the Layer 2 parser
# modules (wire_responder, wire_ja4, wire_h2) can be re-included into
# this crate's test crate via `#[path]`.
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
rustls = "0.23"
tokio-rustls = "0.26"
rcgen = "0.13"
tls-parser = "0.12"
hex = "0.4"
sha2 = "0.10"
thiserror = "2"
h2 = "0.4"
proptest = "1"
rand = "0.8"
