[package]
name = "carbonyl-wreq"
version = "0.0.1-alpha.1"
edition = "2021"
description = "wreq-backed implementation of the carbonyl-fingerprint HttpClient trait"
license = "MIT"
repository = "https://git.integrolabs.net/roctinam/carbonyl-agent"

[lib]
name = "carbonyl_wreq"
crate-type = ["rlib"]

[dependencies]
carbonyl-fingerprint = { path = "../carbonyl-fingerprint" }
thiserror = "2"

# wreq + wreq-util provide the browser-emulating HTTP/2 client. wreq
# pulls boring-sys2 (BoringSSL fork) which requires clang + cmake at
# build time — the project's `.gitea/workflows/check.yml` installs
# both before invoking cargo (`Refs: roctinam/carbonyl-agent#81`).
wreq = "5"
wreq-util = "2"
http = "1"
